name: External Integrations — Validation

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Latest stable custom integrations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Create disposable configuration
        id: config
        run: |
          set -euo pipefail
          config_dir=$(mktemp -d "$GITHUB_WORKSPACE/.ci-external-integrations.XXXXXX")
          rsync -a --exclude='.git' --exclude='custom_components' --exclude='.ci-external-integrations.*' ./ "$config_dir/"
          cp secrets.yaml.sample "$config_dir/secrets.yaml"
          echo "path=${config_dir#"$GITHUB_WORKSPACE/"}" >> "$GITHUB_OUTPUT"

      - name: Download latest stable custom integrations
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python .github/scripts/install-external-integrations.py \
            --registry .github/ci/external-integrations.json \
            --config-dir "${{ steps.config.outputs.path }}" \
            --requirements-out "${{ steps.config.outputs.path }}/.ci-external-integration-requirements.txt" \
            --resolved-out "${{ steps.config.outputs.path }}/.ci-external-integrations.json"

      - name: Prepare config for CI
        env:
          CI_VALIDATE_EXTERNAL_INTEGRATIONS: "true"
        working-directory: ${{ steps.config.outputs.path }}
        run: "$GITHUB_WORKSPACE/.github/scripts/prepare-config-for-ci.sh"

      - name: Build validation image
        run: |
          set -euo pipefail
          docker build \
            --build-arg HA_VERSION=stable \
            --file "${{ steps.config.outputs.path }}/.github/ci/Dockerfile.external-integrations" \
            --tag ha-config-external-integrations:latest \
            "${{ steps.config.outputs.path }}"

      - name: Validate configuration
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint "" \
            --volume "$GITHUB_WORKSPACE:/github/workspace" \
            --workdir /github/workspace \
            ha-config-external-integrations:latest \
            python -m homeassistant \
              --config "${{ steps.config.outputs.path }}" \
              --script check_config
