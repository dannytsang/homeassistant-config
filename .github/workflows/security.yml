name: Security Scanning

# yamllint disable-line rule:truthy
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 2 * * 1"  # Weekly on Monday at 2 AM UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  secret-scanning:
    name: Secret Detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@4ef51f69ca6347aaa76a5e64a87eac9c0c909f71  # v3.100.1
        with:
          path: ./
          extra_args: --only-verified

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY_GITLEAKS_CONFIG_FILE: .github/gitleaks.toml

  python-security:
    name: Python and dependency security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit[sarif] pip-audit

      - name: Resolve external integration requirements
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          config_dir=$(mktemp -d)
          python .github/scripts/install-external-integrations.py \
            --registry .github/ci/external-integrations.json \
            --config-dir "$config_dir" \
            --requirements-out external-integration-requirements.txt \
            --resolved-out resolved-external-integrations.json
          rm -rf "$config_dir"
          test -s external-integration-requirements.txt

      - name: Audit external integration dependencies
        id: pip_audit
        run: |
          pip-audit \
            --requirement external-integration-requirements.txt \
            --format json \
            --output pip-audit-report.json
        continue-on-error: true

      - name: Bandit security scan (JSON)
        id: bandit_json
        run: |
          bandit -r .github/scripts -f json -o bandit-report.json
        continue-on-error: true

      - name: Bandit security scan (SARIF)
        id: bandit
        run: |
          bandit -r .github/scripts -f sarif -o bandit.sarif
        continue-on-error: true

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        if: always()
        with:
          sarif_file: bandit.sarif
          category: bandit

      - name: Upload Bandit JSON results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        if: always()
        with:
          name: bandit-security-report
          path: bandit-report.json
          retention-days: 30

      - name: Upload dependency audit results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce security scan results
        if: always()
        run: |
          if [[ "${{ steps.pip_audit.outcome }}" != "success" ]]; then
            echo "pip-audit found vulnerable or unresolved external integration dependencies."
            exit 1
          fi
          if [[ "${{ steps.bandit_json.outcome }}" != "success" || "${{ steps.bandit.outcome }}" != "success" ]]; then
            echo "Bandit found security issues in CI scripts."
            exit 1
          fi

      - name: Security scan summary
        if: always()
        run: |
          {
            echo "## 🔒 Security Scan Results"
            echo ""
            echo "| Scanner | Status |"
            echo "|---------|--------|"
            echo "| External integration dependencies (pip-audit) | ${{ steps.pip_audit.outcome == 'success' && '✅ Passed' || '❌ Issues found' }} |"
            echo "| Bandit (CI Python scripts) | ${{ steps.bandit.outcome == 'success' && '✅ Passed' || '❌ Issues found' }} |"
            echo ""
            echo "View detailed results in the [Security tab](https://github.com/${{ github.repository }}/security/code-scanning)."
          } >> "$GITHUB_STEP_SUMMARY"
