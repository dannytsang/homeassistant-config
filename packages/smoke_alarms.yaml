automation:
  - id: "1757836826542"
    alias: "Timer: Check Smoke Alarms Complete"
    description: ""
    triggers:
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.check_smoke_alarms
    conditions: []
    actions:
      - action: script.check_smoke_alarms
        data: {}

script:
  check_smoke_alarms:
    alias: Check Smoke Alarms
    sequence:
      - repeat:
          for_each: "{{ state_attr('binary_sensor.smoke_alarms', 'entity_id') }}"
          sequence:
            - if:
                - condition: template
                  value_template: "{{ states(repeat.item) == 'on' }}"
              then:
                - variables:
                    file_name: "{{ now().strftime('%Y-%m-%d %H.%M.%S') }}.jpg"
                - choose:
                    - conditions:
                        - condition: template
                          value_template: "{{ repeat.item == 'binary_sensor.kitchen_smoke_alarm_smoke' }}"
                      sequence:
                        - action: camera.snapshot
                          target:
                            entity_id: camera.kitchen_high_resolution_channel
                          data:
                            filename: "{{ states('input_text.camera_external_folder_path') }}/kitchen/{{ file_name }}"
                        - variables:
                            alarming: >-
                              {{ alarming + [{"entity_id": repeat.item, "file_path": states('input_text.camera_external_folder_path') ~ '/kitchen/' ~ file_name, "state": states(repeat.item)}] }}
                    - conditions:
                        - condition: template
                          value_template: "{{ repeat.item == 'binary_sensor.nest_protect_living_room_smoke_status' }}"
                      sequence:
                        - action: camera.snapshot
                          target:
                            entity_id: camera.living_room_high_resolution_channel
                          data:
                            filename: "{{ states('input_text.camera_external_folder_path') }}/lounge/{{ file_name }}"
                        - variables:
                            alarming: >-
                              {{ alarming + [{"entity_id": repeat.item, "file_path": states('input_text.camera_external_folder_path') ~ '/lounge/' ~ file_name, "state": states(repeat.item)}] }}
                    - conditions:
                        - condition: template
                          value_template: "{{ repeat.item == 'binary_sensor.nest_protect_office_smoke_status' }}"
                      sequence:
                        - action: camera.snapshot
                          target:
                            entity_id: camera.office_high_resolution_channel
                          data:
                            filename: "{{ states('input_text.camera_external_folder_path') }}/office/{{ file_name }}"
                        - variables:
                            alarming: >-
                              {{ alarming + [{"entity_id": repeat.item, "file_path": states('input_text.camera_external_folder_path') ~ '/office/' ~ file_name, "state": states(repeat.item)}] }}
                    - conditions:
                        - condition: template
                          value_template: "{{ repeat.item == 'binary_sensor.nest_protect_upstairs_smoke_status' }}"
                      sequence:
                        - action: camera.snapshot
                          target:
                            entity_id: camera.stairs_high_resolution_channel
                          data:
                            filename: "{{ states('input_text.camera_external_folder_path') }}/stairs/{{ file_name }}"
                        - variables:
                            alarming: >-
                              {{ alarming + [{"entity_id": repeat.item, "file_path": states('input_text.camera_external_folder_path') ~ '/stairs/' ~ file_name, "state": states(repeat.item)}] }}
                  default: []
      - if:
          - condition: template
            value_template: >
              {{ expand('binary_sensor.smoke_alarms')
                | selectattr('state', 'eq', 'on')
                | list
                | count > 0 }}
        then:
          - parallel:
              - action: script.alexa_announce
                data:
                  message: >
                    Warning! Smoke detected in
                    {{ expand('binary_sensor.smoke_alarms')
                      | selectattr('state', 'eq', 'on')
                      | map(attribute='entity_id')
                      | map('area_name')
                      | unique
                      | join(', ') }}
                  suppress_if_quiet: false

              - action: script.send_direct_notification
                data:
                  message: >
                    ⚠️ Smoke detected in the following areas:
                    {{ expand('binary_sensor.smoke_alarms')
                      | selectattr('state', 'eq', 'on')
                      | map(attribute='entity_id')
                      | map('area_name')
                      | unique
                      | join(', ') }}
                    ⚠️
                  title: "⚠️ Smoke alarm still active ⚠️"
                  suppress_if_quiet: false
                  priority: high

          - action: timer.start
            target:
              entity_id: timer.check_smoke_alarms
            data:
              duration: "00:01:00"
    mode: single
