automation:
  - id: "1613937312554"
    alias: "Home Assistant CI"
    description: "https://community.home-assistant.io/t/guide-to-setting-up-a-fully-automated-ci-for-hassio/51576"
    triggers:
      - trigger: webhook
        webhook_id: git_pull
        allowed_methods:
          - POST
        local_only: false
    conditions:
      - condition: state
        entity_id: input_boolean.enable_github_integration
        state: "on"
    actions:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.json.key_token|string == states('input_text.github_pull_key') }}"
            sequence:
              - parallel:
                  - action: script.send_to_home_log
                    data:
                      message: "build ✅ passed. Pulling changes."
                      title: ":construction_worker: 🛠️ GitHub"
                      log_level: "Normal"
                  - action: hassio.addon_start
                    data:
                      addon: core_git_pull
              - wait_template: "{{ is_state('binary_sensor.git_pull_running', 'on') }}"
                timeout: "00:01:00"
                continue_on_timeout: false
              - wait_template: "{{ is_state('binary_sensor.git_pull_running', 'off') }}"
                timeout: "00:05:00"
                continue_on_timeout: false
              - action: statistics.reload
              - action: script.reload
              - action: automation.reload
        default:
          - action: script.send_direct_notification
            data:
              message: "Build ✅ passed but incorrect :key: key was sent."
              title: "⚠️ 👷 🛠️ GitHub ⚠️"
              people:
                entity_id:
                  - person.danny
    mode: single
