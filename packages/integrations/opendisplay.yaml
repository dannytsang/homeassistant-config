# Created by Danny Tsang <danny@tsang.uk>
automation:
  - id: "1769277054493"
    alias: "OpenDisplay: Home Summary"
    description: >-
      Shows household status, weather, calendar, climate, and energy data
      on the OpenDisplay e-paper display.
    trace:
      stored_traces: 10
    triggers:
      - trigger: homeassistant
        event: start
        id: startup
      - trigger: time_pattern
        minutes: "/30"
        id: scheduled_refresh
      - trigger: template
        value_template: "{{ states.person | selectattr('state', 'eq', 'home') | list | count }}"
        id: people_home_changed
      - trigger: template
        value_template: "{{ states.light | selectattr('state', 'eq', 'on') | list | count }}"
        id: lights_on_changed
      - trigger: state
        entity_id:
          - weather.home
          - calendar.family
          - calendar.tsang_children
          - lock.front_door
          - alarm_control_panel.house_alarm
          - climate.hive_receiver_heat
          - sensor.growatt_sph_pv_energy
          - sensor.growatt_sph_load_energy
          - sensor.growatt_sph_grid_energy_out
          - sensor.growatt_sph_battery_state_of_charge
        id: source_changed
    conditions: []
    actions:
      - action: calendar.get_events
        target:
          entity_id:
            - calendar.family
            - calendar.tsang_children
        data:
          start_date_time: "{{ (now() - timedelta(days=1)).isoformat() }}"
          duration: "96:00:00"
        response_variable: calendars
      - action: weather.get_forecasts
        target:
          entity_id: weather.home
        data:
          type: daily
        response_variable: forecasts
      - action: opendisplay.drawcustom
        target:
          device_id: 662305b757f9b07a501f19d4f34c723b
        data:
          background: white
          rotate: 270
          refresh_type: full
          payload:
            - type: text
              value: "HOUSE OF TSANG"
              x: "5%"
              y: "4%"
              size: 50
              color: black
            - type: dlimg
              url: "/config/media/house-of-tsang-logo.png"
              x: 560
              y: 30
              xsize: 260
              ysize: 150
              resize_method: contain
            - type: text
              value: "{{ now().strftime('%A %-d %B') }}"
              x: "5%"
              y: "8%"
              size: 25
              color: black
            - type: text
              value: >-
                {%- set family = calendars['calendar.family'].events | default([], true) -%}
                {%- set children = calendars['calendar.tsang_children'].events | default([], true) -%}
                {%- set active = namespace(event=none) -%}
                {%- for event in (family + children) | sort(attribute='start') -%}
                  {%- if active.event is none and as_datetime(event.start) <= now() and as_datetime(event.end) > now() -%}
                    {%- set active.event = event -%}
                  {%- endif -%}
                {%- endfor -%}
                IN PROGRESS · {{ as_datetime(active.event.start).strftime('%a %-d %b · %H:%M') if active.event else '' }}
              x: "5%"
              y: "12%"
              size: 22
              color: blue
              visible: >-
                {%- set family = calendars['calendar.family'].events | default([], true) -%}
                {%- set children = calendars['calendar.tsang_children'].events | default([], true) -%}
                {%- set active = namespace(found=false) -%}
                {%- for event in family + children -%}
                  {%- if as_datetime(event.start) <= now() and as_datetime(event.end) > now() -%}
                    {%- set active.found = true -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ 'true' if active.found else 'false' }}
            - type: text
              value: >-
                {%- set family = calendars['calendar.family'].events | default([], true) -%}
                {%- set children = calendars['calendar.tsang_children'].events | default([], true) -%}
                {%- set active = namespace(event=none) -%}
                {%- for event in (family + children) | sort(attribute='start') -%}
                  {%- if active.event is none and as_datetime(event.start) <= now() and as_datetime(event.end) > now() -%}
                    {%- set active.event = event -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ active.event.summary | default('Current event', true) | truncate(38, true, '…') if active.event else '' }}
              x: "5%"
              y: "16%"
              size: 28
              color: black
              visible: >-
                {%- set family = calendars['calendar.family'].events | default([], true) -%}
                {%- set children = calendars['calendar.tsang_children'].events | default([], true) -%}
                {%- set active = namespace(found=false) -%}
                {%- for event in family + children -%}
                  {%- if as_datetime(event.start) <= now() and as_datetime(event.end) > now() -%}
                    {%- set active.found = true -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ 'true' if active.found else 'false' }}
            - type: icon
              value: >-
                {%- set icons = {
                  'clear-night': 'weather-night',
                  'cloudy': 'weather-cloudy',
                  'fog': 'weather-fog',
                  'hail': 'weather-hail',
                  'lightning': 'weather-lightning',
                  'lightning-rainy': 'weather-lightning-rainy',
                  'partlycloudy': 'weather-partly-cloudy',
                  'pouring': 'weather-pouring',
                  'rainy': 'weather-rainy',
                  'snowy': 'weather-snowy',
                  'snowy-rainy': 'weather-snowy-rainy',
                  'sunny': 'weather-sunny',
                  'windy': 'weather-windy',
                  'windy-variant': 'weather-windy-variant'
                } -%}
                mdi:{{ icons.get(states('weather.home'), 'weather-cloudy') }}
              x: "75%"
              y: "3%"
              size: 88
              color: yellow
            - type: text
              value: >-
                {{ state_attr('weather.home', 'temperature') | float(0) | round(0) | int }}{{ state_attr('weather.home', 'temperature_unit') | default('°C', true) }}
              x: "96%"
              y: "5%"
              size: 92
              anchor: rt
              color: black
            - type: text
              value: "{{ states('weather.home') | replace('_', ' ') | title }}"
              x: "96%"
              y: "14%"
              size: 36
              anchor: rt
              color: black
            - type: text
              value: >-
                {% set forecast = forecasts['weather.home'].forecast | default([], true) %}
                H {{ forecast[0].temperature | float(0) | round(0) | int if forecast | count else '—' }}{{ state_attr('weather.home', 'temperature_unit') | default('°C', true) }} / L {{ forecast[0].templow | float(0) | round(0) | int if forecast | count else '—' }}{{ state_attr('weather.home', 'temperature_unit') | default('°C', true) }}
              x: "96%"
              y: "19%"
              size: 25
              anchor: rt
              color: blue
            - type: icon
              value: >-
                {%- set icons = {
                  'clear-night': 'weather-night',
                  'cloudy': 'weather-cloudy',
                  'fog': 'weather-fog',
                  'hail': 'weather-hail',
                  'lightning': 'weather-lightning',
                  'lightning-rainy': 'weather-lightning-rainy',
                  'partlycloudy': 'weather-partly-cloudy',
                  'pouring': 'weather-pouring',
                  'rainy': 'weather-rainy',
                  'snowy': 'weather-snowy',
                  'snowy-rainy': 'weather-snowy-rainy',
                  'sunny': 'weather-sunny',
                  'windy': 'weather-windy',
                  'windy-variant': 'weather-windy-variant'
                } -%}
                {% set forecast = forecasts['weather.home'].forecast | default([], true) -%}
                mdi:{{ icons.get(forecast[1].condition, 'weather-cloudy') if forecast | count > 1 else 'weather-cloudy' }}
              x: "58%"
              y: "21%"
              size: 36
              color: yellow
            - type: text
              value: >-
                {% set forecast = forecasts['weather.home'].forecast | default([], true) %}
                TOMORROW · H {{ forecast[1].temperature | float(0) | round(0) | int if forecast | count > 1 else '—' }}{{ state_attr('weather.home', 'temperature_unit') | default('°C', true) }} / L {{ forecast[1].templow | float(0) | round(0) | int if forecast | count > 1 else '—' }}{{ state_attr('weather.home', 'temperature_unit') | default('°C', true) }}
              x: "96%"
              y: "24%"
              size: 25
              anchor: rt
              color: blue
            - type: line
              x_start: "5%"
              x_end: "95%"
              y_start: "29%"
              y_end: "29%"
              width: 4
              fill: black
            - type: icon
              value: "{{ 'mdi:lock' if is_state('lock.front_door', 'locked') else 'mdi:lock-open-variant' }}"
              x: "5%"
              y: "33%"
              size: 62
              color: "{{ 'blue' if is_state('lock.front_door', 'locked') else 'red' }}"
            - type: text
              value: "DOOR"
              x: "5%"
              y: "42%"
              size: 24
              color: blue
            - type: icon
              value: >-
                {{ 'mdi:shield-lock' if states('alarm_control_panel.house_alarm').startswith('armed') else 'mdi:shield-check' }}
              x: "14%"
              y: "33%"
              size: 62
              color: "{{ 'red' if states('alarm_control_panel.house_alarm').startswith('armed') else 'green' }}"
            - type: text
              value: "ALARM"
              x: "14%"
              y: "42%"
              size: 24
              color: green
            - type: icon
              value: mdi:account-multiple
              x: "25%"
              y: "33%"
              size: 55
              color: "{{ 'green' if states.person | selectattr('state', 'eq', 'home') | list | count else 'black' }}"
            - type: text
              value: "{{ states.person | selectattr('state', 'eq', 'home') | list | count }}"
              x: "30%"
              y: "35%"
              size: 28
              color: blue
            - type: text
              value: "HOME"
              x: "25%"
              y: "42%"
              size: 20
              color: green
            - type: icon
              value: mdi:lightbulb
              x: "37%"
              y: "33%"
              size: 55
              color: "{{ 'yellow' if states.light | selectattr('state', 'eq', 'on') | list | count else 'black' }}"
            - type: text
              value: "{{ states.light | selectattr('state', 'eq', 'on') | list | count }}"
              x: "42%"
              y: "35%"
              size: 28
              color: blue
            - type: text
              value: "LIGHTS"
              x: "37%"
              y: "42%"
              size: 20
              color: black
            - type: text
              value: "HEATING"
              x: "56%"
              y: "34%"
              size: 32
              color: "{{ 'red' if is_state_attr('climate.hive_receiver_heat', 'hvac_action', 'heating') else 'blue' }}"
            - type: icon
              value: mdi:radiator
              x: "52%"
              y: "34%"
              size: 32
              color: "{{ 'red' if is_state_attr('climate.hive_receiver_heat', 'hvac_action', 'heating') else 'blue' }}"
            - type: text
              value: >-
                NOW {{ state_attr('climate.hive_receiver_heat', 'current_temperature') | float(0) | round(1) }}{{ state_attr('climate.hive_receiver_heat', 'temperature_unit') | default('°C', true) }} / TARGET {{ state_attr('climate.hive_receiver_heat', 'temperature') | float(0) | round(1) }}{{ state_attr('climate.hive_receiver_heat', 'temperature_unit') | default('°C', true) }}
              x: "60%"
              y: "39%"
              size: 42
              color: black
            - type: line
              x_start: "5%"
              x_end: "95%"
              y_start: "54%"
              y_end: "54%"
              width: 4
              fill: black
            - type: multiline
              value: >-
                {%- set family = calendars['calendar.family'].events | default([], true) -%}
                {%- set children = calendars['calendar.tsang_children'].events | default([], true) -%}
                {%- set events = (family + children) | sort(attribute='start') -%}
                {%- set agenda = namespace(last_date='', lines=[], count=0) -%}
                {%- for event in events -%}
                  {%- set start = event.start | string -%}
                  {%- if as_datetime(start) >= now() and agenda.count < 5 -%}
                    {%- set event_date = as_datetime(start).strftime('%A %-d %B') -%}
                    {%- if event_date != agenda.last_date -%}
                      {%- set agenda.lines = agenda.lines + ['[accent]' ~ event_date ~ '[/accent]'] -%}
                      {%- set agenda.last_date = event_date -%}
                    {%- endif -%}
                    {%- set event_time = as_datetime(start).strftime('%H:%M') if 'T' in start else 'All day' -%}
                    {%- set summary = event.summary | default('Untitled event', true) | truncate(32, true, '…') -%}
                    {%- set agenda.lines = agenda.lines + [event_time ~ ' · ' ~ summary] -%}
                    {%- set agenda.count = agenda.count + 1 -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ agenda.lines | join('|') if agenda.lines else 'No upcoming events' }}
              delimiter: "|"
              x: "5%"
              y: "58%"
              offset_y: 40
              size: 34
              color: black
              parse_colors: true
            - type: text
              value: "ENERGY"
              x: "72%"
              y: "58%"
              size: 42
              color: blue
            - type: text
              value: >-
                {% set value = states('sensor.growatt_sph_pv_energy') | float(0) %}
                {% set unit = state_attr('sensor.growatt_sph_pv_energy', 'unit_of_measurement') | default('kWh', true) %}
                {{ (value / 1000 if unit == 'Wh' else value) | round(1) }} kWh
              x: "77%"
              y: "66%"
              size: 38
              color: green
            - type: icon
              value: mdi:solar-power
              x: "72%"
              y: "65%"
              size: 42
              color: green
            - type: text
              value: >-
                {% set value = states('sensor.growatt_sph_load_energy') | float(0) %}
                {% set unit = state_attr('sensor.growatt_sph_load_energy', 'unit_of_measurement') | default('kWh', true) %}
                {{ (value / 1000 if unit == 'Wh' else value) | round(1) }} kWh
              x: "77%"
              y: "73%"
              size: 38
              color: blue
            - type: icon
              value: mdi:home-lightning-bolt
              x: "72%"
              y: "72%"
              size: 42
              color: black
            - type: text
              value: >-
                {% set value = states('sensor.growatt_sph_grid_energy_out') | float(0) %}
                {% set unit = state_attr('sensor.growatt_sph_grid_energy_out', 'unit_of_measurement') | default('kWh', true) %}
                {{ (value / 1000 if unit == 'Wh' else value) | round(1) }} kWh
              x: "77%"
              y: "80%"
              size: 38
              color: black
            - type: icon
              value: mdi:transmission-tower
              x: "72%"
              y: "79%"
              size: 42
              color: black
            - type: icon
              value: mdi:battery
              x: "72%"
              y: "87%"
              size: 42
              color: yellow
            - type: progress_bar
              x_start: "77%"
              x_end: "95%"
              y_start: "88%"
              y_end: "92%"
              progress: "{{ states('sensor.growatt_sph_battery_state_of_charge') | float(0) }}"
              fill: yellow
              background: white
              outline: black
              width: 2
              show_percentage: true
            - type: text
              value: "LAST UPDATED · {{ now().strftime('%a %-d %b · %H:%M') }}"
              x: "95%"
              y: "96%"
              size: 16
              anchor: rt
              color: blue
    mode: single
    max_exceeded: silent
