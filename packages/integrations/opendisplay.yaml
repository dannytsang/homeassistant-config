# Created by Danny Tsang <danny@tsang.uk>
automation:
  - id: "1769277054493"
    alias: "OpenDisplay: Home Summary"
    description: >-
      Shows household status, weather, calendar, climate, and energy data
      on the OpenDisplay e-paper display.
    trace:
      stored_traces: 10
    triggers:
      - trigger: homeassistant
        event: start
        id: startup
      - trigger: time_pattern
        minutes: "/30"
        id: scheduled_refresh
      - trigger: state
        entity_id:
          - weather.home
          - calendar.family
          - calendar.tsang_children
          - lock.front_door
          - alarm_control_panel.house_alarm
          - climate.hive_receiver_heat
          - sensor.growatt_sph_pv_energy
          - sensor.growatt_sph_load_energy
          - sensor.growatt_sph_grid_energy_out
          - sensor.growatt_sph_battery_state_of_charge
          - sensor.growatt_sph_pv_power
          - sensor.growatt_sph_load_power
        id: source_changed
    conditions: []
    actions:
      - action: calendar.get_events
        target:
          entity_id:
            - calendar.family
            - calendar.tsang_children
        data:
          start_date_time: "{{ now().isoformat() }}"
          duration: "72:00:00"
        response_variable: calendars
      - action: weather.get_forecasts
        target:
          entity_id: weather.home
        data:
          type: daily
        response_variable: forecasts
      - action: opendisplay.drawcustom
        target:
          device_id: 662305b757f9b07a501f19d4f34c723b
        data:
          background: white
          rotate: 270
          refresh_type: full
          payload:
            - type: text
              value: "HOME"
              x: "5%"
              y: "4%"
              size: 60
              color: black
            - type: text
              value: "LAST UPDATED · {{ now().strftime('%a %-d %b · %H:%M') }}"
              x: "5%"
              y: "12%"
              size: 24
              color: blue
            - type: icon
              value: >-
                {%- set icons = {
                  'clear-night': 'weather-night',
                  'cloudy': 'weather-cloudy',
                  'fog': 'weather-fog',
                  'hail': 'weather-hail',
                  'lightning': 'weather-lightning',
                  'lightning-rainy': 'weather-lightning-rainy',
                  'partlycloudy': 'weather-partly-cloudy',
                  'pouring': 'weather-pouring',
                  'rainy': 'weather-rainy',
                  'snowy': 'weather-snowy',
                  'snowy-rainy': 'weather-snowy-rainy',
                  'sunny': 'weather-sunny',
                  'windy': 'weather-windy',
                  'windy-variant': 'weather-windy-variant'
                } -%}
                mdi:{{ icons.get(states('weather.home'), 'weather-cloudy') }}
              x: "75%"
              y: "3%"
              size: 88
              color: yellow
            - type: text
              value: >-
                {{ state_attr('weather.home', 'temperature') | float(0) | round(0) | int }}{{ state_attr('weather.home', 'temperature_unit') | default('°C', true) }}
              x: "96%"
              y: "5%"
              size: 92
              anchor: rt
              color: black
            - type: text
              value: "{{ states('weather.home') | replace('_', ' ') | title }}"
              x: "96%"
              y: "14%"
              size: 36
              anchor: rt
              color: black
            - type: text
              value: >-
                {% set forecast = forecasts['weather.home'].forecast | default([], true) %}
                TODAY · H {{ forecast[0].temperature | float(0) | round(0) | int if forecast | count else '—' }}{{ state_attr('weather.home', 'temperature_unit') | default('°C', true) }} / L {{ forecast[0].templow | float(0) | round(0) | int if forecast | count else '—' }}{{ state_attr('weather.home', 'temperature_unit') | default('°C', true) }}
              x: "96%"
              y: "19%"
              size: 25
              anchor: rt
              color: blue
            - type: icon
              value: >-
                {%- set icons = {
                  'clear-night': 'weather-night',
                  'cloudy': 'weather-cloudy',
                  'fog': 'weather-fog',
                  'hail': 'weather-hail',
                  'lightning': 'weather-lightning',
                  'lightning-rainy': 'weather-lightning-rainy',
                  'partlycloudy': 'weather-partly-cloudy',
                  'pouring': 'weather-pouring',
                  'rainy': 'weather-rainy',
                  'snowy': 'weather-snowy',
                  'snowy-rainy': 'weather-snowy-rainy',
                  'sunny': 'weather-sunny',
                  'windy': 'weather-windy',
                  'windy-variant': 'weather-windy-variant'
                } -%}
                {% set forecast = forecasts['weather.home'].forecast | default([], true) -%}
                mdi:{{ icons.get(forecast[1].condition, 'weather-cloudy') if forecast | count > 1 else 'weather-cloudy' }}
              x: "77%"
              y: "21%"
              size: 42
              color: yellow
            - type: text
              value: >-
                {% set forecast = forecasts['weather.home'].forecast | default([], true) %}
                TOMORROW · H {{ forecast[1].temperature | float(0) | round(0) | int if forecast | count > 1 else '—' }}{{ state_attr('weather.home', 'temperature_unit') | default('°C', true) }} / L {{ forecast[1].templow | float(0) | round(0) | int if forecast | count > 1 else '—' }}{{ state_attr('weather.home', 'temperature_unit') | default('°C', true) }}
              x: "96%"
              y: "24%"
              size: 25
              anchor: rt
              color: blue
            - type: line
              x_start: "5%"
              x_end: "95%"
              y_start: "29%"
              y_end: "29%"
              width: 4
              fill: black
            - type: icon
              value: "{{ 'mdi:lock' if is_state('lock.front_door', 'locked') else 'mdi:lock-open-variant' }}"
              x: "5%"
              y: "33%"
              size: 62
              color: "{{ 'blue' if is_state('lock.front_door', 'locked') else 'red' }}"
            - type: text
              value: "DOOR"
              x: "5%"
              y: "42%"
              size: 24
              color: blue
            - type: icon
              value: >-
                {{ 'mdi:shield-lock' if states('alarm_control_panel.house_alarm').startswith('armed') else 'mdi:shield-check' }}
              x: "21%"
              y: "33%"
              size: 62
              color: "{{ 'red' if states('alarm_control_panel.house_alarm').startswith('armed') else 'green' }}"
            - type: text
              value: "ALARM"
              x: "21%"
              y: "42%"
              size: 24
              color: green
            - type: text
              value: "HEATING"
              x: "56%"
              y: "34%"
              size: 32
              color: "{{ 'red' if is_state_attr('climate.hive_receiver_heat', 'hvac_action', 'heating') else 'blue' }}"
            - type: icon
              value: mdi:radiator
              x: "52%"
              y: "34%"
              size: 32
              color: "{{ 'red' if is_state_attr('climate.hive_receiver_heat', 'hvac_action', 'heating') else 'blue' }}"
            - type: text
              value: >-
                NOW {{ state_attr('climate.hive_receiver_heat', 'current_temperature') | float(0) | round(1) }}{{ state_attr('climate.hive_receiver_heat', 'temperature_unit') | default('°C', true) }} / TARGET {{ state_attr('climate.hive_receiver_heat', 'temperature') | float(0) | round(1) }}{{ state_attr('climate.hive_receiver_heat', 'temperature_unit') | default('°C', true) }}
              x: "60%"
              y: "39%"
              size: 42
              color: black
            - type: line
              x_start: "5%"
              x_end: "95%"
              y_start: "54%"
              y_end: "54%"
              width: 4
              fill: black
            - type: text
              value: "UP NEXT"
              x: "5%"
              y: "58%"
              size: 48
              color: blue
            - type: multiline
              value: >-
                {%- set family = calendars['calendar.family'].events | default([], true) -%}
                {%- set children = calendars['calendar.tsang_children'].events | default([], true) -%}
                {%- set events = (family + children) | sort(attribute='start') -%}
                {%- set agenda = namespace(last_date='', lines=[]) -%}
                {%- for event in events[:5] -%}
                  {%- set start = event.start | string -%}
                  {%- set event_date = as_datetime(start).strftime('%A %-d %B') -%}
                  {%- if event_date != agenda.last_date -%}
                    {%- set agenda.lines = agenda.lines + ['[accent]' ~ event_date ~ '[/accent]'] -%}
                    {%- set agenda.last_date = event_date -%}
                  {%- endif -%}
                  {%- set event_time = as_datetime(start).strftime('%H:%M') if 'T' in start else 'All day' -%}
                  {%- set summary = event.summary | default('Untitled event', true) | truncate(26, true, '…') -%}
                  {%- set agenda.lines = agenda.lines + [event_time ~ ' · ' ~ summary] -%}
                {%- endfor -%}
                {{ agenda.lines | join('|') if agenda.lines else 'No upcoming events' }}
              delimiter: "|"
              x: "5%"
              y: "66%"
              offset_y: 48
              size: 40
              color: black
              parse_colors: true
            - type: text
              value: "ENERGY"
              x: "72%"
              y: "58%"
              size: 42
              color: blue
            - type: text
              value: "TODAY · kW SOLAR / HOME"
              x: "72%"
              y: "63%"
              size: 20
              color: black
            - type: plot
              x_start: "72%"
              y_start: "66%"
              x_end: "95%"
              y_end: "81%"
              duration: 86400
              low: 0
              round_values: true
              size: 16
              ylegend:
                color: black
                position: left
                size: 16
              yaxis:
                width: 1
                color: black
                grid: 3
                grid_color: black
                grid_style: dotted
              xlegend:
                format: "%H"
                interval: 21600
                snap_to_hours: true
                color: black
                position: bottom
                size: 16
              xaxis:
                width: 1
                color: black
                grid: false
              data:
                - entity: sensor.growatt_sph_pv_power
                  color: green
                  width: 3
                  smooth: true
                  value_scale: 0.001
                - entity: sensor.growatt_sph_load_power
                  color: blue
                  width: 3
                  smooth: true
                  value_scale: 0.001
            - type: text
              value: "SOLAR"
              x: "76%"
              y: "83%"
              size: 16
              color: green
            - type: text
              value: "HOME"
              x: "85%"
              y: "83%"
              size: 16
              color: blue
            - type: icon
              value: mdi:battery
              x: "72%"
              y: "89%"
              size: 42
              color: yellow
            - type: progress_bar
              x_start: "77%"
              x_end: "95%"
              y_start: "89%"
              y_end: "93%"
              progress: "{{ states('sensor.growatt_sph_battery_state_of_charge') | float(0) }}"
              fill: yellow
              background: white
              outline: black
              width: 2
              show_percentage: true
    mode: single
    max_exceeded: silent
