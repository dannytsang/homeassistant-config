# Created by Danny Tsang <danny@tsang.uk>
automation:
  - id: "1769277054493"
    alias: "OpenDisplay: Home Summary"
    description: >-
      Shows household status, weather, calendar, climate, and energy data
      on the OpenDisplay e-paper display.
    trace:
      stored_traces: 10
    triggers:
      - trigger: homeassistant
        event: start
        id: startup
      - trigger: time_pattern
        minutes: "/30"
        id: scheduled_refresh
      - trigger: template
        value_template: "{{ states.person | selectattr('state', 'eq', 'home') | list | count }}"
        id: people_home_changed
    conditions: []
    actions:
      - action: calendar.get_events
        target:
          entity_id:
            - calendar.family
            - calendar.tsang_children
        data:
          start_date_time: "{{ (now() - timedelta(days=1)).isoformat() }}"
          duration: "96:00:00"
        response_variable: calendars
      - action: weather.get_forecasts
        target:
          entity_id: weather.home
        data:
          type: daily
        response_variable: forecasts
      - variables:
          render_snapshot_at: "{{ now().isoformat() }}"
          render_solar_power: "{{ states('sensor.growatt_sph_pv_power') | float(0) }}"
          render_home_power: "{{ states('sensor.growatt_sph_load_power') | float(0) }}"
          render_grid_import_power: "{{ states('sensor.house_grid_import_power') | float(0) }}"
          render_grid_export_power: "{{ states('sensor.house_grid_export_power') | float(0) }}"
          render_solar_peak_power: "{{ states('sensor.opendisplay_solar_energy_peak') | float(0) }}"
          render_home_peak_power: "{{ states('sensor.opendisplay_home_energy_peak') | float(0) }}"
          render_grid_peak_power: "{{ states('sensor.opendisplay_grid_export_peak') | float(0) }}"
          render_battery_charge_power: "{{ states('sensor.growatt_battery_charge_power') | float(0) }}"
          render_battery_discharge_power: "{{ states('sensor.growatt_battery_discharge_power') | float(0) }}"
          render_solar_power_unit: "{{ state_attr('sensor.growatt_sph_pv_power', 'unit_of_measurement') | default('W', true) }}"
          render_home_power_unit: "{{ state_attr('sensor.growatt_sph_load_power', 'unit_of_measurement') | default('W', true) }}"
          render_grid_power_unit: "{{ state_attr('sensor.house_grid_import_power', 'unit_of_measurement') | default('W', true) }}"
          render_battery_runtime: "{{ state_attr('sensor.battery_charge_remaining_hours', 'duration') | default('—', true) }}"
      - action: opendisplay.drawcustom
        target:
          device_id: 662305b757f9b07a501f19d4f34c723b
        data:
          background: white
          rotate: 270
          refresh_type: full
          payload:
            - type: dlimg
              url: "/config/media/house-of-tsang-logo.png"
              x: 20
              y: 24
              xsize: 400
              ysize: 165
              resize_method: contain
            - type: text
              value: "{{ now().strftime('%A %-d %B') }}"
              x: "5%"
              y: "17%"
              size: 25
              color: black
            - type: icon
              value: >-
                {%- set icons = {
                  'clear-night': 'weather-night', 'cloudy': 'weather-cloudy',
                  'fog': 'weather-fog', 'hail': 'weather-hail',
                  'lightning': 'weather-lightning', 'lightning-rainy': 'weather-lightning-rainy',
                  'partlycloudy': 'weather-partly-cloudy', 'pouring': 'weather-pouring',
                  'rainy': 'weather-rainy', 'snowy': 'weather-snowy',
                  'snowy-rainy': 'weather-snowy-rainy', 'sunny': 'weather-sunny',
                  'windy': 'weather-windy', 'windy-variant': 'weather-windy-variant'
                } -%}
                mdi:{{ icons.get(states('weather.home'), 'weather-cloudy') }}
              x: "{{ '22.6%' if states('sensor.gw2000a_outdoor_temperature') | float(0) < 0 else '25.3%' }}"
              y: "2.9%"
              size: 88
              color: "{{ 'white' if is_state('weather.home', 'clear-night') else 'black' }}"
            - type: icon
              value: >-
                {%- set icons = {
                  'clear-night': 'weather-night',
                  'cloudy': 'weather-cloudy',
                  'fog': 'weather-fog',
                  'hail': 'weather-hail',
                  'lightning': 'weather-lightning',
                  'lightning-rainy': 'weather-lightning-rainy',
                  'partlycloudy': 'weather-partly-cloudy',
                  'pouring': 'weather-pouring',
                  'rainy': 'weather-rainy',
                  'snowy': 'weather-snowy',
                  'snowy-rainy': 'weather-snowy-rainy',
                  'sunny': 'weather-sunny',
                  'windy': 'weather-windy',
                  'windy-variant': 'weather-windy-variant'
