              y_start: "62%"
              y_end: >-
                {%- set family = calendars['calendar.family'].events | default([], true) -%}
                {%- set children = calendars['calendar.tsang_children'].events | default([], true) -%}
                {%- set active = namespace(count=0) -%}
                {%- for event in family + children -%}
                  {%- if as_datetime(event.start) <= now() and as_datetime(event.end) > now() -%}
                    {%- set active.count = active.count + 1 -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ 66 + ((active.count - 1) * 3) }}%
              fill: white
              outline: red
              width: 3
              visible: >-
                {%- set family = calendars['calendar.family'].events | default([], true) -%}
                {%- set children = calendars['calendar.tsang_children'].events | default([], true) -%}
                {%- set active = namespace(found=false) -%}
                {%- for event in family + children -%}
                  {%- if as_datetime(event.start) <= now() and as_datetime(event.end) > now() -%}
                    {%- set active.found = true -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ 'true' if active.found else 'false' }}
            - type: multiline
              value: >-
                {%- set family = calendars['calendar.family'].events | default([], true) -%}
                {%- set children = calendars['calendar.tsang_children'].events | default([], true) -%}
                {%- set events = (family + children) | sort(attribute='start') -%}
                {%- set agenda = namespace(last_date='', lines=[], count=0) -%}
                {%- set active = namespace(events=[]) -%}
                {%- for event in events -%}
                  {%- if as_datetime(event.start) <= now() and as_datetime(event.end) > now() -%}
                    {%- set active.events = active.events + [event] -%}
                  {%- endif -%}
                {%- endfor -%}
                {%- if active.events -%}
                  {%- set active_start = active.events[0].start | string -%}
                  {%- set active_date = as_datetime(active_start).strftime('%A %-d %B') -%}
                  {%- set agenda.lines = agenda.lines + ['[blue]' ~ active_date ~ '[/blue]'] -%}
                  {%- for event in active.events -%}
                    {%- set active_start = event.start | string -%}
                    {%- set active_time = as_datetime(active_start).strftime('%H:%M') if 'T' in active_start else 'All day' -%}
                    {%- set active_summary = event.summary | default('Current event', true) | truncate(32, true, '…') -%}
                    {%- set agenda.lines = agenda.lines + ['[red]' ~ active_time ~ ' · ' ~ active_summary ~ ' · *[/red]'] -%}
                  {%- endfor -%}
                  {%- set agenda.last_date = active_date -%}
                {%- endif -%}
                {%- for event in events -%}
                  {%- set start = event.start | string -%}
                  {%- if as_datetime(start) >= now() and agenda.count < 5 -%}
                    {%- set event_date = as_datetime(start).strftime('%A %-d %B') -%}
                    {%- if event_date != agenda.last_date -%}
                      {%- set agenda.lines = agenda.lines + ['[blue]' ~ event_date ~ '[/blue]'] -%}
                      {%- set agenda.last_date = event_date -%}
                    {%- endif -%}
                    {%- set event_time = as_datetime(start).strftime('%H:%M') if 'T' in start else 'All day' -%}
                    {%- set summary = event.summary | default('Untitled event', true) | truncate(32, true, '…') -%}
                    {%- set agenda.lines = agenda.lines + [event_time ~ ' · ' ~ summary] -%}
                    {%- set agenda.count = agenda.count + 1 -%}
                  {%- endif -%}
                {%- endfor -%}
                {{ agenda.lines | join('|') if agenda.lines else 'No upcoming events' }}
