# Created by Danny Tsang <danny@tsang.uk>
automation:
  - id: "1769277054493"
    alias: "OpenDisplay: Home Summary"
    description: >-
      Shows household status, weather, calendar, climate, and energy data
      on the OpenDisplay e-paper display.
    trace:
      stored_traces: 10
    triggers:
      - trigger: homeassistant
        event: start
        id: startup
      - trigger: time_pattern
        minutes: "/30"
        id: scheduled_refresh
      - trigger: template
        value_template: "{{ states.person | selectattr('state', 'eq', 'home') | list | count }}"
        id: people_home_changed
      - trigger: template
        value_template: "{{ states.light | selectattr('state', 'eq', 'on') | list | count }}"
        id: lights_on_changed
      - trigger: state
        entity_id:
          - weather.home
          - calendar.family
          - calendar.tsang_children
          - lock.front_door
          - alarm_control_panel.house_alarm
          - binary_sensor.external_doors_and_windows
          - climate.hive_receiver_heat
          - sensor.growatt_sph_pv_energy
          - sensor.growatt_sph_load_energy
          - sensor.growatt_sph_grid_energy_out
          - sensor.growatt_sph_battery_state_of_charge
          - sensor.growatt_sph_pv_power
          - sensor.growatt_sph_battery_charge_power
          - sensor.growatt_sph_battery_discharge_power
          - sensor.grid_import_power
          - sensor.grid_export_power
          - sensor.open_display_solar_energy_peak
          - sensor.open_display_home_energy_peak
          - sensor.open_display_grid_export_peak
        id: source_changed
    conditions: []
    actions:
      - action: calendar.get_events
        target:
          entity_id:
            - calendar.family
            - calendar.tsang_children
        data:
          start_date_time: "{{ (now() - timedelta(days=1)).isoformat() }}"
          duration: "96:00:00"
        response_variable: calendars
      - action: weather.get_forecasts
        target:
          entity_id: weather.home
        data:
          type: daily
        response_variable: forecasts
      - action: opendisplay.drawcustom
        target:
          device_id: 662305b757f9b07a501f19d4f34c723b
        data:
          background: white
          rotate: 270
          refresh_type: full
          payload:
            - type: dlimg
              url: "/config/media/house-of-tsang-logo.png"
              x: 20
              y: 24
              xsize: 400
              ysize: 165
              resize_method: contain
            - type: text
              value: "{{ now().strftime('%A %-d %B') }}"
              x: "5%"
              y: "17%"
              size: 25
              color: black
            - type: icon
              value: >-
                {%- set icons = {
                  'clear-night': 'weather-night', 'cloudy': 'weather-cloudy',
                  'fog': 'weather-fog', 'hail': 'weather-hail',
                  'lightning': 'weather-lightning', 'lightning-rainy': 'weather-lightning-rainy',
                  'partlycloudy': 'weather-partly-cloudy', 'pouring': 'weather-pouring',
                  'rainy': 'weather-rainy', 'snowy': 'weather-snowy',
                  'snowy-rainy': 'weather-snowy-rainy', 'sunny': 'weather-sunny',
                  'windy': 'weather-windy', 'windy-variant': 'weather-windy-variant'
                } -%}
                mdi:{{ icons.get(states('weather.home'), 'weather-cloudy') }}
              x: "74.9%"
              y: "2.9%"
              size: 88
              color: black
            - type: icon
              value: >-
